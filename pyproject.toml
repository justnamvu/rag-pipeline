[tool.black]
line-length = 88
target-version = ["py314"]
exclude = '''
/(
    .venv
    | __pycache__
    | .git
)/
'''

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

pythonpath = ["backend", "backend/tests"]
markers = [
    "integration: need a live OpenSearch and a real OpenAI key (deselect with -m 'not integration')",
]
addopts = "-v --strict-markers"