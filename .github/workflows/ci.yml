name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: rag-pipeline

jobs:

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint (flake8)
        run: flake8 backend/app/

      - name: Format check (black)
        run: black --check backend/app/

      - name: Unit tests (pytest)
        env:
          OPENSEARCH_URL: http://localhost:9200
          OPENSEARCH_INDEX_NAME: rag_vectors
          EMBEDDINGS_API_KEY: dummy-key-for-ci
          LLM_API_KEY: dummy-key-for-ci
        run: pytest -m "not integration"

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only on pushes to main since these tests cost OpenAI credits
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: backend-ci

    services:
      opensearch:
        image: opensearchproject/opensearch:3.7.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        # GitHub waits for this healthcheck before starting the job steps
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run integration tests
        env:
          # opensearch service is reachable at localhost from the runner
          OPENSEARCH_URL: http://localhost:9200
          OPENSEARCH_INDEX_NAME: rag_vectors
          EMBEDDINGS_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDINGS_MODEL: text-embedding-3-small
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL_NAME: gpt-5.4-nano
        run: |
          # The index must exist before the tests store anything.
          python -c "from app.services.index_manager import create_index; create_index()"
          pytest -m integration


  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}